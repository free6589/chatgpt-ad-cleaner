<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 620" role="img" aria-label="Illustration: a browser window with the upgrade buttons crossed out">
  <defs>
    <style>
      .win { fill: #ffffff; stroke: #e3e5e9; stroke-width: 2; }
      .bar { fill: #f7f8fa; }
      .dot { fill: #e0e2e6; }
      .side { fill: #fbfbfc; }
      .line { fill: #e9ebef; }
      .pill { fill: #eef0f3; }
      .pilltext { font: 600 15px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #5b616b; }
      .hint { font: 500 14px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #9aa0a6; }
      .card { fill: #f5f6f8; stroke: #e3e5e9; stroke-width: 1.5; }
      .cardtext { font: 600 15px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #4b5158; }
      .cardsub { font: 400 13px -apple-system, "Segoe UI", Roboto, Arial, sans-serif; fill: #8d939b; }
      .cross { stroke: #e5484d; stroke-width: 5; stroke-linecap: round; }
      .bubble { fill: #f0f2f5; }
      .bubble2 { fill: #e8f3ee; }
      .composer { fill: #ffffff; stroke: #dfe2e7; stroke-width: 2; }
    </style>
  </defs>

  <!-- window -->
  <rect class="win" x="24" y="24" width="952" height="572" rx="16"/>
  <path class="bar" d="M24 40a16 16 0 0 1 16-16h920a16 16 0 0 1 16 16v28H24z"/>
  <circle class="dot" cx="56" cy="46" r="7"/>
  <circle class="dot" cx="80" cy="46" r="7"/>
  <circle class="dot" cx="104" cy="46" r="7"/>

  <!-- sidebar -->
  <rect class="side" x="24" y="68" width="280" height="528" rx="0"/>
  <rect class="line" x="48" y="100" width="150" height="12" rx="6"/>
  <rect class="line" x="48" y="150" width="200" height="10" rx="5"/>
  <rect class="line" x="48" y="180" width="170" height="10" rx="5"/>
  <rect class="line" x="48" y="210" width="190" height="10" rx="5"/>
  <rect class="line" x="48" y="240" width="140" height="10" rx="5"/>

  <!-- sidebar offer button (before) -->
  <rect class="pill" x="44" y="486" width="240" height="40" rx="10"/>
  <text class="pilltext" x="60" y="512">Get offer</text>
  <line class="cross" x1="214" y1="496" x2="268" y2="516"/>
  <line class="cross" x1="268" y1="496" x2="214" y2="516"/>

  <!-- profile row -->
  <circle class="line" cx="66" cy="552" r="16"/>
  <rect class="line" x="92" y="542" width="86" height="11" rx="5"/>
  <rect class="line" x="92" y="560" width="46" height="9" rx="4"/>

  <!-- top bar offer button (before) -->
  <rect class="pill" x="748" y="80" width="180" height="38" rx="19"/>
  <text class="pilltext" x="768" y="105">Free offer</text>
  <line class="cross" x1="892" y1="90" x2="916" y2="108"/>
  <line class="cross" x1="916" y1="90" x2="892" y2="108"/>

  <!-- chat bubbles -->
  <rect class="bubble" x="360" y="150" width="380" height="48" rx="14"/>
  <rect class="bubble2" x="360" y="214" width="520" height="76" rx="14"/>
  <rect class="bubble" x="360" y="306" width="300" height="48" rx="14"/>

  <!-- promo card above composer (before) -->
  <rect class="card" x="360" y="400" width="560" height="92" rx="14"/>
  <text class="cardtext" x="382" y="434">Upgrade to Plus</text>
  <text class="cardsub" x="382" y="458">Advanced reasoning, bigger memory, better images</text>
  <rect class="pill" x="790" y="424" width="112" height="34" rx="17"/>
  <text class="pilltext" x="806" y="446">Try free</text>
  <line class="cross" x1="770" y1="410" x2="916" y2="476"/>
  <line class="cross" x1="916" y1="410" x2="770" y2="476"/>

  <!-- composer -->
  <rect class="composer" x="360" y="512" width="560" height="56" rx="28"/>
  <text class="hint" x="392" y="546">Ask anything</text>

  <!-- caption -->
  <text class="hint" x="500" y="600">illustration — these three blocks are what the add-on hides</text>
</svg>
